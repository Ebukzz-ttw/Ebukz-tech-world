<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EBUKZ TECH WORLD | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <h1>EBUKZ TECH WORLD</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="services.html">Services</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main class="section">
        <div class="container contact-layout">
            <div>
                <h2>Contact Us</h2>
                <p>Do you have a question or need more information about our services? Contact us using the details below or complete the form.</p>
                <p><strong>Email:</strong> ebukztechworld@gmail.com</p>
                <p><strong>Telephone:</strong> +234 7048001673</p>
            </div>

            <form id="contactForm" novalidate>
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName">

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email">

                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject">

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5"></textarea>

                <button type="submit">Submit</button>
                <p id="formFeedback" class="feedback" aria-live="polite"></p>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 EBUKZ TECH WORLD. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
